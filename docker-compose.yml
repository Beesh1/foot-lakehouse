services:
  webhook:
    image: foot-lakehouse
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
    command: python scripts/stream.py
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - foot-lakehouse-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  litestream:
    image: foot-lakehouse
    volumes:
      - app-data:/app/data
      - ./litestream.yml:/etc/litestream.yml
    command: litestream replicate -config /etc/litestream.yml
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    networks:
      - foot-lakehouse-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - foot-lakehouse-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb myminio/lakehouse || true;
      /usr/bin/mc anonymous set private myminio/lakehouse || true;
      "
    networks:
      - foot-lakehouse-net

networks:
  foot-lakehouse-net:
    driver: bridge

volumes:
  app-data:
  minio-data: